<div class="demo-bar"><div class="wrap demo-inner"><div><b>ИНТЕРАКТИВНЫЙ МАКЕТ</b><span class="demo-description"> · Примеры данных, без реальных платежей</span></div><button class="link-button" data-action="reset">Сбросить пример</button></div></div>
<header class="site-header"><div class="wrap header-row"><a class="brand" href="#home" aria-label="Спасская слобода, главная"><span class="brand-icon">P</span><span><strong>Спасская слобода</strong><small>АВТОМОБИЛЬНАЯ ПАРКОВКА</small></span></a><nav class="nav" aria-label="Основная навигация"><a href="#home" data-nav="home">Главная</a><a href="#pay" data-nav="pay">Оплатить</a><a href="#mine" data-nav="mine">Моя стоянка</a><a href="#owner" data-nav="owner" class="owner-link">Владельцу</a></nav></div></header>
<main id="main" class="wrap" tabindex="-1"></main>
<footer><div class="wrap footer-inner"><span>Ярославль · Спасская слобода</span><span>Макет для согласования. Данные хранятся до перезагрузки страницы.</span></div></footer>
<dialog id="modal" aria-labelledby="dialog-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// ponytail: one local file and in-memory records for review; real payments need a server and bank confirmation.
const MAP='https://yandex.ru/navi/org/avtomobilnaya_parkovka/102778932534?si=ngyu7j78zau51k83wgbncujvzr';
const NOW='2026-09-26T11:00:00.000Z';
const main=document.querySelector('#main'), modal=document.querySelector('#modal');
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function normalizePlate(value){const letters={A:'А',B:'В',E:'Е',K:'К',M:'М',H:'Н',O:'О',P:'Р',C:'С',T:'Т',Y:'У',X:'Х'};return value.toUpperCase().replace(/[\s-]/g,'').replace(/[ABEKMHOPCTYX]/g,x=>letters[x]);}
const validPlate=value=>/^[АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2}\d{2,3}$/.test(normalizePlate(value));
const addDays=(iso,days)=>new Date(new Date(iso).getTime()+days*86400000).toISOString();
const fmt=iso=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}).format(new Date(iso));
const short=iso=>new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}).format(new Date(iso));
function plateHtml(value){return `<span class="plate">${esc(value.slice(0,6))}<em>${esc(value.slice(6))}<small>RUS</small></em></span>`;}
function freshRecords(){return [{plate:'А123АА76',model:'LADA Vesta',arrival:NOW,until:addDays(NOW,2),status:'paid'},{plate:'В456ВВ76',model:'Kia Rio',arrival:'2026-09-25T06:00:00.000Z',until:'2026-09-26T06:00:00.000Z',status:'check'},{plate:'Е789ЕЕ76',model:'Renault Logan',arrival:'2026-09-26T08:20:00.000Z',until:null,status:'waiting'}];}
let records=freshRecords(),payments=[],activePlate='А123АА76',debtPreview=false,ownerTab='cars',filter='all',query='',lastPayment=null,toastTimer;
let flow={step:1,kind:'new',plate:'',model:'',days:2,start:NOW,error:''};
const states={paid:['Оплачено',''],check:['Проверить срок','amber'],waiting:['Ожидает оплаты','neutral'],left:['Выехал','neutral']};
const current=()=>records.find(x=>x.plate===activePlate)||records[0];
const badge=status=>`<span class="pill ${states[status][1]}">${states[status][0]}</span>`;
function notify(message){clearTimeout(toastTimer);document.querySelector('#toast').textContent=message;toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4500);}
function go(route){if(location.hash==='#'+route)render(true);else location.hash=route;}
function freshFlow(){flow={step:1,kind:'new',plate:'',model:'',days:2,start:NOW,error:''};}
function route(){return ['home','pay','mine','owner'].includes(location.hash.slice(1))?location.hash.slice(1):'home';}
function lot(){return `<div class="hero-art"><svg class="lot" viewBox="0 0 480 350" role="img" aria-label="Условная схема открытой стоянки, не план реальной территории"><rect x="1" y="1" width="478" height="348" rx="12" fill="#294657"/><path d="M22 147h436v66H22Z" fill="#3e5867"/><path d="M43 180h374m-10-8 10 8-10 8" fill="none" stroke="#eacb57" stroke-width="2"/><path d="M28 34h421M28 318h421" fill="none" stroke="#5a7569" stroke-width="8"/>${[0,1,2,3,4,5].map((n)=>`<use href="#lot-car" x="${38+n*69}" y="61" width="30" height="57" style="color:${n===3?'#eacb57':'#f7f6ef'}"/><use href="#lot-car" x="${38+n*69}" y="244" width="30" height="57" style="color:${n===1?'#eacb57':'#d4dede'}"/>`).join('')}<rect x="14" y="156" width="38" height="49" rx="4" fill="#eacb57"/><text x="33" y="188" fill="#17334b" font-family="Arial" font-size="25" text-anchor="middle" font-weight="bold">P</text></svg><p class="lot-caption">Свободная расстановка. Условная схема, не план участка.</p></div>`;}
function home(){return `<section class="hero" aria-labelledby="hero-title"><div class="hero-top"><div><p class="kicker">Ярославль / Открытая стоянка</p><h1 id="hero-title">Парковка<br>в Спасской<br>слободе</h1><p class="hero-copy">Оставьте автомобиль на стоянке.<br>Оплатите нужный срок с телефона<br>и возвращайтесь к своим делам.</p><div class="actions"><button class="btn" data-action="start">Оплатить стоянку ${icon('arrow')}</button><a class="btn ghost-light" href="${MAP}" target="_blank" rel="noopener noreferrer">Как доехать ${icon('pin')}</a></div></div>${lot()}</div><div class="hero-foot"><span>${icon('car')}Около 80 автомобилей</span><span>${icon('user')}На территории есть охранник</span><span>${icon('check')}Учёт по госномеру</span></div></section><section class="journey" aria-label="Как оплатить"><h2>Всё необходимое<br>на вашем телефоне</h2><div class="steps-inline"><div><span class="step-number">01</span><h3>Укажите автомобиль</h3><p>Госномер с регионом и модель. Номер места не нужен.</p></div><div><span class="step-number">02</span><h3>Выберите срок</h3><p>Количество суток и оплата через СБП в своём банке.</p></div><div><span class="step-number">03</span><h3>Сохраните подтверждение</h3><p>Оплаченный срок и продление в разделе «Моя стоянка».</p></div></div></section><section class="location-band"><div>${icon('pin')}<div><strong>Ярославль, Спасская слобода</strong><p>Точка организации, предоставленная заказчиком</p></div></div><a class="btn secondary compact" href="${MAP}" target="_blank" rel="noopener noreferrer">Открыть Яндекс Карты ${icon('arrow')}</a></section>`;}
function progress(){return `<ol class="progress">${['Автомобиль','Срок и оплата','Готово'].map((v,i)=>`<li class="${flow.step===i+1?'current':flow.step>i+1?'done':''}" ${flow.step===i+1?'aria-current="step"':''}><span>${i+1}</span>${v}</li>`).join('')}</ol>`;}
function payment(){let content='';if(flow.step===1){content=`<h2>Ваш автомобиль</h2><p>Укажите госномер и модель, чтобы охранник мог найти вашу оплату.</p><form id="vehicle-form" class="form" novalidate><label class="field"><span>Госномер и регион</span><input id="plate" name="plate" class="plate-input" autocomplete="off" spellcheck="false" maxlength="14" placeholder="А123АА 76" value="${esc(flow.plate)}" aria-describedby="form-error"><small>Например, А123АА 76. Можно вводить латиницей.</small></label><label class="field"><span>Марка и модель</span><input id="model" name="model" autocomplete="off" maxlength="60" placeholder="Например, LADA Vesta" value="${esc(flow.model)}" aria-describedby="form-error"></label><p id="form-error" class="error" role="alert">${esc(flow.error)}</p><button class="btn block" type="submit">Выбрать срок ${icon('arrow')}</button><p class="form-hint">В макете введённые данные никуда не отправляются.</p></form><div class="demo-fill"><button class="link-button" data-action="fill-example">Заполнить демонстрационный автомобиль</button></div>`;}else if(flow.step===2){content=`<h2>${flow.kind==='debt'?'Оплата доплаты':flow.kind==='extend'?'Продлить стоянку':'Срок стоянки'}</h2><p>${flow.kind==='debt'?'Пример начисления по подтверждённому периоду.':'Выберите, на сколько суток оставить автомобиль.'}</p><div class="car-line"><div>${plateHtml(flow.plate)}<p class="car-model">${esc(flow.model)}</p></div>${flow.kind==='new'?'<button class="btn link" data-action="back-step">Изменить</button>':''}</div>${flow.kind==='debt'?'<p class="payment-note">В этом примере охранник подтвердил ещё 2 суток пребывания автомобиля.</p>':`<fieldset class="duration"><legend>Количество суток</legend><div class="duration-options">${[1,2,3,7].map(n=>`<label><input type="radio" name="days" value="${n}" ${flow.days===n?'checked':''}><span>${n} ${n===1?'сутки':'суток'}</span></label>`).join('')}</div></fieldset>`}<dl class="definition"><div><dt>${flow.kind==='extend'?'Продление с':'Начало периода'}</dt><dd>${esc(fmt(flow.start))}</dd></div><div><dt>Окончание периода</dt><dd id="period-end">${esc(fmt(addDays(flow.start,flow.days)))}</dd></div><div class="cost-row"><dt>Стоимость</dt><dd>По тарифу стоянки</dd></div></dl><p class="payment-note">Тариф ещё не утверждён. В рабочем приложении здесь будет точная сумма в рублях. Для примера сутки равны 24 часам.</p><p id="payment-error" class="error" role="alert">${esc(flow.error)}</p><button class="btn block" data-action="bank">Посмотреть оплату СБП ${icon('arrow')}</button><p class="form-hint">Откроется демонстрация. Деньги не списываются.</p>`;}else{content=`<div class="center"><div class="success-icon">${icon('check')}</div><h2>${flow.kind==='debt'?'Доплата учтена':'Стоянка оплачена'}</h2><p class="small muted">Пример успешного подтверждения</p><div style="margin-top:25px">${plateHtml(flow.plate)}<p class="car-model">${esc(flow.model)}</p></div></div><div class="paid-until"><span class="kicker">Оплачено до</span><strong>${esc(fmt(addDays(flow.start,flow.days)))}</strong></div><div class="success-actions"><a class="btn block" href="#mine">Моя стоянка ${icon('arrow')}</a><a class="btn secondary block" href="#owner">Посмотреть уведомление владельцу</a></div><p class="form-hint">Это демонстрационный результат. Реального платежа и кассового чека нет.</p>`;}return `<div class="payment-layout"><aside class="pay-aside"><a class="back" href="#home">${icon('back')} На главную</a><h1 style="margin-top:24px">Оплата с телефона</h1><p>Такой экран откроется после сканирования QR-кода на стоянке.</p>${progress()}<p class="small">Один интерфейс для сайта, Telegram и MAX.</p></aside><section class="payment-sheet" aria-label="Оформление стоянки">${content}</section></div>`;}
function mine(){const car=current();return `<div class="page-heading"><div><p class="kicker">Личный кабинет / пример</p><h1>Моя стоянка</h1><p>Оплаченный срок, продление и расчёт доплаты для вашего автомобиля.</p></div></div><div class="account-grid"><section class="account-card">${plateHtml(car.plate)}<p class="car-model">${esc(car.model)}</p><div>${debtPreview?'<span class="pill amber">Требуется доплата</span>':badge(car.status)}</div>${debtPreview?`<div class="debt-box"><span class="kicker">Неоплаченный период</span><strong>${short(car.until||NOW)} - ${short(addDays(car.until||NOW,2))}</strong><p>2 суток × суточный тариф. Пример: охранник подтвердил, что автомобиль оставался на стоянке.</p></div><dl class="definition"><div><dt>К оплате</dt><dd>Сумма по тарифу</dd></div></dl><button class="btn block" style="margin-top:20px" data-action="debt-pay">Оплатить доплату ${icon('arrow')}</button>`:`<div class="paid-until"><span class="kicker">${car.until?'Оплачено до':'Срок ещё не оплачен'}</span><strong>${car.until?esc(fmt(car.until)):'Выберите срок стоянки'}</strong></div><button class="btn block" data-action="extend">${car.until?'Продлить стоянку':'Перейти к оплате'} ${icon('arrow')}</button>`}<div class="demo-example">Управление макетом: <button class="link-button" data-action="toggle-debt">${debtPreview?'Вернуть оплаченный пример':'Показать пример задолженности'}</button></div></section><aside class="account-aside"><h2>Всё прозрачно</h2><div class="note-item"><h3>Ваш оплаченный срок</h3><p>В рабочей системе статус изменится только после подтверждения платежа банком.</p></div><div class="note-item"><h3>Понятная доплата</h3><p>Начисление содержит период, основание и сумму. Окончание предоплаты требует проверки фактического пребывания автомобиля.</p></div><div class="note-item"><h3>Личный доступ</h3><p>История и задолженность доступны подтверждённому клиенту. В макете показан вымышленный автомобиль.</p></div></aside></div>`;}
function notification(){if(!lastPayment)return `<div class="notification"><p class="kicker">Уведомление владельцу / пример</p><h3>Оплата подтверждена</h3>${plateHtml('А123АА76')}<p class="car-model">LADA Vesta</p><p>2 суток · 26-28 сентября · СБП</p><footer>Сумма по тарифу. Пройдите оплату в макете, чтобы увидеть свою запись.</footer></div>`;return `<div class="notification"><p class="kicker">Новое уведомление / демонстрация</p><h3>Оплата подтверждена</h3>${plateHtml(lastPayment.plate)}<p class="car-model">${esc(lastPayment.model)}</p><p>${lastPayment.days} ${lastPayment.days===1?'сутки':'суток'} · до ${esc(fmt(lastPayment.until))}</p><footer>СБП · Сумма по тарифу · Реальный платёж не выполнялся</footer></div>`;}
function filteredRows(){const q=query.trim().toLowerCase();return records.filter(r=>(filter==='all'||r.status===filter)&&(!q||(r.plate+' '+r.model).toLowerCase().includes(q)||r.plate.includes(normalizePlate(query))));}
function carRows(){const rows=filteredRows();return rows.length?rows.map(r=>`<tr><td data-label="Автомобиль">${plateHtml(r.plate)}<p class="car-model">${esc(r.model)}</p></td><td data-label="Въезд">${esc(short(r.arrival))}</td><td data-label="Оплачено до">${r.until?esc(short(r.until)):'Ожидается оплата'}</td><td data-label="Статус">${badge(r.status)}</td><td data-label="Действие"><button class="row-open" data-action="record" data-plate="${esc(r.plate)}" aria-label="Открыть автомобиль ${esc(r.plate)}">Открыть</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Автомобили не найдены. Измените поиск или фильтр.</td></tr>';}
function paymentsTable(){return payments.length?`<div class="table-box"><table><thead><tr><th>Автомобиль</th><th>Период</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>${payments.map(p=>`<tr><td data-label="Автомобиль">${plateHtml(p.plate)}<p class="car-model">${esc(p.model)}</p></td><td data-label="Период">${p.days} ${p.days===1?'сутки':'суток'}<p class="car-model">До ${esc(short(p.until))}</p></td><td data-label="Сумма">По тарифу</td><td data-label="Статус"><span class="pill">Демо: подтверждено</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="table-box empty"><h3>Пока нет платежей в этом примере</h3><p style="margin-top:10px">Пройдите сценарий оплаты, и запись появится здесь.</p><button class="btn compact" style="margin-top:20px" data-action="start">Попробовать оплату</button></div>';}
function owner(){return `<div class="page-heading"><div><p class="kicker">Кабинет владельца и охранника / демо</p><h1>Стоянка под контролем</h1><p>Автомобили, оплаченные сроки и уведомления в одном месте.</p></div><button class="btn" data-action="arrival">${icon('car')} Отметить въезд</button></div><div class="owner-toolbar"><div class="tabs" role="tablist" aria-label="Раздел кабинета"><button role="tab" data-tab="cars" aria-selected="${ownerTab==='cars'}">Автомобили</button><button role="tab" data-tab="payments" aria-selected="${ownerTab==='payments'}">Оплаты (${payments.length})</button></div>${ownerTab==='cars'?`<label class="search"><span class="visually-hidden">Поиск по номеру или модели</span>${icon('search')}<input id="owner-search" type="search" placeholder="Госномер или модель" value="${esc(query)}"></label>`:''}</div>${ownerTab==='cars'?`<div class="filters" aria-label="Фильтр автомобилей">${[['all','Все'],['paid','Оплачено'],['check','Проверить срок'],['waiting','Ожидают оплаты'],['left','Выехали']].map(([key,label])=>`<button data-filter="${key}" aria-pressed="${filter===key}">${label}</button>`).join('')}</div><div class="table-box"><table aria-label="Журнал автомобилей"><thead><tr><th>Автомобиль</th><th>Въезд</th><th>Оплачено до</th><th>Статус</th><th></th></tr></thead><tbody id="car-rows">${carRows()}</tbody></table></div><p class="owner-caption">Вымышленные записи · Демонстрационная дата: 26 сентября 2026 · Вместимость со слов заказчика: около 80 автомобилей.</p>`:paymentsTable()}<div class="owner-bottom"><div><h2>Охранник подтверждает въезд и выезд</h2><p>Без шлагбаума приложение само не определяет, находится ли машина на площадке. Откройте запись автомобиля, чтобы посмотреть действия охранника.</p><p style="margin-top:16px">Telegram и MAX будут использовать общий учёт. Условия отправки уведомлений через MAX нужно проверить при подключении.</p></div>${notification()}</div>`;}
function render(focus=false){const view=route();document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});main.innerHTML=({home,pay:payment,mine,owner}[view])();if(focus){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true});}}
function openDialog(content){modal.innerHTML=content;modal.showModal();}
function dialogHead(label){return `<div class="dialog-head"><span class="kicker">${label}</span><button class="close-button" data-action="close" aria-label="Закрыть окно">${icon('close')}</button></div>`;}
function openBank(){openDialog(`${dialogHead('Демонстрация СБП')}<h2 id="dialog-title">Переход в банк</h2><p>В рабочем приложении здесь откроется выбор банка и платёж с точной суммой. Выберите результат для проверки макета.</p><div class="dialog-list"><p>Автомобиль<strong>${esc(flow.plate)} · ${esc(flow.model)}</strong></p><p>Период<strong>${flow.days} ${flow.days===1?'сутки':'суток'}, до ${esc(fmt(addDays(flow.start,flow.days)))}</strong></p></div><div class="bank-actions"><button class="btn block" data-action="pay-success">Показать успешную оплату</button><button class="btn secondary block" data-action="pay-fail">Показать отклонённую оплату</button></div><p class="form-hint">Деньги не списываются. Вход в банк не требуется.</p>`);}
function finishPayment(){if(flow.step!==2)return;const until=addDays(flow.start,flow.days);let car=records.find(r=>r.plate===flow.plate);if(car){Object.assign(car,{model:flow.model,until,status:'paid'});}else{car={plate:flow.plate,model:flow.model,arrival:flow.start,until,status:'paid'};records.unshift(car);}activePlate=car.plate;lastPayment={plate:car.plate,model:car.model,days:flow.days,until};payments.unshift({...lastPayment});debtPreview=false;flow.step=3;flow.error='';modal.close();render(true);}
function startExtension(kind){const car=current();flow={step:2,kind,plate:car.plate,model:car.model,days:2,start:car.until&&car.until>NOW?car.until:NOW,error:''};go('pay');}
function arrivalDialog(){openDialog(`${dialogHead('Действие охранника')}<h2 id="dialog-title">Отметить въезд</h2><p>Добавьте автомобиль в демонстрационный журнал.</p><form id="arrival-form" novalidate><label class="field"><span>Госномер и регион</span><input name="plate" class="plate-input" placeholder="А123АА 76" maxlength="14" aria-describedby="arrival-error"></label><label class="field"><span>Марка и модель</span><input name="model" placeholder="Марка и модель" maxlength="60" aria-describedby="arrival-error"></label><p id="arrival-error" class="error" role="alert"></p><button class="btn block" style="margin-top:25px" type="submit">Добавить автомобиль</button></form>`);}
function recordDialog(plate){const car=records.find(r=>r.plate===plate);if(!car)return;openDialog(`${dialogHead('Запись автомобиля')}<h2 id="dialog-title">${esc(car.plate)}</h2><p>${esc(car.model)}</p><div class="dialog-list"><p>Статус<strong>${states[car.status][0]}</strong></p><p>Въезд<strong>${esc(fmt(car.arrival))}</strong></p><p>Оплачено до<strong>${car.until?esc(fmt(car.until)):'Платёж ещё не получен'}</strong></p></div>${car.status==='check'?'<p>Охранник проверяет нахождение машины и применяет согласованное правило доплаты.</p>':''}${car.status!=='left'?`<button class="btn block" style="margin-top:24px" data-action="departure" data-plate="${esc(car.plate)}">Отметить выезд в макете</button>`:'<p>Автомобиль отмечен как выехавший.</p>'}`);}
function validateVehicle(form,errorEl){const plate=normalizePlate(form.elements.plate.value),model=form.elements.model.value.trim();if(!validPlate(plate)){errorEl.textContent='Введите госномер с регионом, например А123АА 76.';form.elements.plate.focus();return null;}if(model.length<2){errorEl.textContent='Укажите марку и модель автомобиля.';form.elements.model.focus();return null;}return {plate,model};}
document.addEventListener('submit',e=>{if(!['vehicle-form','arrival-form'].includes(e.target.id))return;e.preventDefault();const form=e.target,errorEl=document.querySelector(form.id==='vehicle-form'?'#form-error':'#arrival-error');const data=validateVehicle(form,errorEl);if(!data)return;if(form.id==='vehicle-form'){const existing=records.find(r=>r.plate===data.plate&&r.status!=='left');if(existing&&existing.until&&existing.until>NOW){flow.kind='extend';flow.start=existing.until;}else{flow.kind='new';flow.start=NOW;}Object.assign(flow,data,{step:2,error:''});render(true);}else{const existing=records.find(r=>r.plate===data.plate);if(existing&&existing.status!=='left'){errorEl.textContent='Этот автомобиль уже есть в журнале. Откройте его запись.';return;}if(existing){Object.assign(existing,data,{arrival:NOW,until:null,status:'waiting'});}else records.unshift({...data,arrival:NOW,until:null,status:'waiting'});filter='all';query='';ownerTab='cars';modal.close();render();notify('Въезд добавлен в демонстрационный журнал.');}});
document.addEventListener('click',e=>{if(e.target.closest('a[data-nav="pay"]')){e.preventDefault();freshFlow();go('pay');return;}const tab=e.target.closest('[data-tab]'),filterButton=e.target.closest('[data-filter]');if(tab){ownerTab=tab.dataset.tab;render();document.querySelector('[data-tab="'+ownerTab+'"]').focus();return;}if(filterButton){filter=filterButton.dataset.filter;render();document.querySelector('[data-filter="'+filter+'"]').focus();return;}const el=e.target.closest('[data-action]');if(!el)return;switch(el.dataset.action){case 'start':freshFlow();go('pay');break;case 'fill-example':document.querySelector('#plate').value='А123АА 76';document.querySelector('#model').value='LADA Vesta';document.querySelector('#plate').focus();break;case 'back-step':flow.step=1;flow.error='';render(true);break;case 'bank':openBank();break;case 'close':modal.close();break;case 'pay-success':finishPayment();break;case 'pay-fail':modal.close();flow.error='Оплата не подтверждена. Можно попробовать ещё раз. В макете деньги не списывались.';render();document.querySelector('#payment-error').scrollIntoView({block:'nearest'});break;case 'extend':startExtension('extend');break;case 'debt-pay':startExtension('debt');break;case 'toggle-debt':debtPreview=!debtPreview;render();break;case 'arrival':arrivalDialog();break;case 'record':recordDialog(el.dataset.plate);break;case 'departure':{const car=records.find(r=>r.plate===el.dataset.plate);if(car)car.status='left';modal.close();render();notify('Выезд отмечен в демонстрационном журнале.');break;}case 'reset':records=freshRecords();payments=[];activePlate='А123АА76';debtPreview=false;lastPayment=null;ownerTab='cars';filter='all';query='';freshFlow();if(modal.open)modal.close();go('home');notify('Демонстрационные данные восстановлены.');break;}});
document.addEventListener('change',e=>{if(e.target.name==='days'){flow.days=Number(e.target.value);flow.error='';document.querySelector('#period-end').textContent=fmt(addDays(flow.start,flow.days));const error=document.querySelector('#payment-error');if(error)error.textContent='';}});
document.addEventListener('input',e=>{if(e.target.id==='owner-search'){query=e.target.value;document.querySelector('#car-rows').innerHTML=carRows();}});
document.addEventListener('keydown',e=>{const tab=e.target.closest('[data-tab]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();ownerTab=e.key==='Home'?'cars':e.key==='End'?'payments':ownerTab==='cars'?'payments':'cars';render();document.querySelector('[data-tab="'+ownerTab+'"]').focus();});
window.addEventListener('hashchange',()=>render(true));
// Small checks for the demo's input boundary and day arithmetic; available again in the browser console.
function selfTest(){if(normalizePlate('a123aa 76')!=='А123АА76'||!validPlate('А123АА 76')||validPlate('<script>')||addDays(NOW,2)!=='2026-09-28T11:00:00.000Z'||esc('<img>')!=='&lt;img&gt;')throw new Error('Проверка логики макета не пройдена');return true;}
selfTest();render();
</script>
</body>
</html>
